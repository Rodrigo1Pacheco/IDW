<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form action="/procesar-registro" method="post">
    <h2>Registro de Alumno</h2>

    <div class="campo">
      <label for="codigo_alumno">Código de Alumno (8 dígitos):</label>
      <input type="text" id="codigo_alumno" name="codigo_alumno" pattern="[0-9]{8}" minlength="8" maxlength="8" placeholder="Ejemplo: 20261187" required>
    </div>

    <div class="campo">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required>
    </div>

    <div class="campo">
      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required>
    </div>

    <div class="campo">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" placeholder="example@gmail.com" required>
    </div>

    <div class="campo">
      <label for="contrasena">Contraseña:</label>
      <input type="password" id="contrasena" name="contrasena" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Mínimo 8 caracteres, un número y una mayúscula" required>
      <div class="campo-checkbox" style="margin-top: 6px;">
        <input type="checkbox" id="ver_clave" onclick="togglePassword()">
        <label for="ver_clave" style="font-size: 13px; font-weight: normal;">Mostrar contraseña</label>
      </div>
    </div>

    <div class="campo">
      <label for="telefono">Número de teléfono:</label>
      <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" maxlength="9" placeholder="Ejemplo: XXX-XXX-XXX" required>
    </div>

    <div class="campo">
      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" name="fecha_nacimiento" required>
    </div>

    <div class="campo">
      <label for="carrera">Seleccionar Carrera:</label>
      <select id="carrera" name="carrera" required>
        <option value="" disabled selected>Seleccionar</option>
        <option value="Ingenieria de Sistemas">Ingeniería de Sistemas</option>
        <option value="Ingenieria Civil">Ingeniería Civil</option>
        <option value="Ingenieria Metalurgica">Ingeniería Metalúrgica</option>
        <option value="Ingenieria Industrial">Ingeniería Industrial</option>
        <option value="Ingenieria Electronica">Ingeniería Electrónica</option>
        <option value="Ingenieria de Minas">Ingeniería de Minas</option>
        <option value="Ingenieria de Alimentos">Ingeniería de Alimentos</option>
        <option value="Ingenieria de Telecomunicaciones">Ingeniería de Telecomunicaciones</option>
        <option value="Derecho">Derecho</option>
      </select>
    </div>

    <fieldset>
      <legend>Turno de su Horario</legend>
      <div class="opciones-inline">
        <input type="radio" name="turno" id="opcion1" value="Mañana" required>
        <label for="opcion1">Mañana</label>

        <input type="radio" name="turno" id="opcion2" value="Tarde">
        <label for="opcion2">Tarde</label>

        <input type="radio" name="turno" id="opcion3" value="Noche">
        <label for="opcion3">Noche</label>
      </div>
    </fieldset>

    <div class="campo campo-checkbox">
      <input type="checkbox" id="terminos" name="terminos" required>
      <label for="terminos">Acepto los términos y condiciones</label>
    </div>

    <div class="campo">
      <label for="msg">Comentarios:</label>
      <textarea id="msg" name="mensaje_usuario" rows="4"></textarea>
    </div>

    <button type="submit">Enviar Formulario</button>
  </form>

  <script>
    function togglePassword() {
      var campo = document.getElementById("contrasena");
      campo.type = campo.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
